name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Use `npm install`, not `npm ci`. The lock file is generated on macOS,
      # where the wasm fallback for @tailwindcss/oxide is skipped; its optional
      # peer deps (@emnapi/*) then differ from what npm resolves on the Linux
      # runner, so `npm ci`'s strict check fails on packages the native build
      # never uses. `npm install` still honors the lock and installs the right
      # native binaries.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type-check + build
        run: npm run build
